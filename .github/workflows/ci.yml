# CI (docs/specs/14-quality-and-ci.md QA-10): the same checks as scripts/check.sh, on every pull
# request and push to main. Target under 6 minutes. backend is a required check; the frontend job
# is added with the frontend foundation (W0.9).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: suwapath
          POSTGRES_PASSWORD: suwapath
          POSTGRES_DB: suwapath
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U suwapath" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SUWAPATH_ENV: test
      DATABASE_URL: postgresql+psycopg://suwapath:suwapath@localhost:5433/suwapath
      SUWAPATH_TEST_DATABASE_URL: postgresql+psycopg://suwapath:suwapath@localhost:5433/suwapath_test
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Text style
        run: python ../scripts/check_text.py
      - name: Lint and format
        run: |
          ruff check suwapath tests migrations main.py
          ruff format --check suwapath tests migrations main.py
      - name: Module boundaries
        run: lint-imports
      - name: Types
        run: mypy
      - name: Migrations
        run: |
          alembic upgrade head
          alembic check
      - name: Tests
        run: pytest -q -o addopts=""
      - name: OpenAPI drift
        if: hashFiles('project/frontend/src/shared/api/openapi.json') != ''
        run: |
          python main.py openapi --out /tmp/openapi.json
          diff -u frontend/src/shared/api/openapi.json /tmp/openapi.json

  security:
    # Informational (not a required check): findings are reviewed in the pull request (SG-27).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit -r project/requirements.txt
