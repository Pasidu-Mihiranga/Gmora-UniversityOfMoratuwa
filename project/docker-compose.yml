name: suwapath

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: suwapath
      POSTGRES_PASSWORD: suwapath
      POSTGRES_DB: suwapath
    ports:
      - "5433:5432"   # host 5433 avoids clashing with a local Postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suwapath -d suwapath"]
      interval: 5s
      timeout: 3s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  api:
    build: .
    command: ["python", "main.py", "api", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://suwapath:suwapath@db:5432/suwapath
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
