# Elder-care and chronic-disease complaints (NAV-5 extension).
#
# DDXPlus has no patients for these, so there are no counted likelihoods to use. Instead each
# complaint routes straight to doctor types and a window, used when the complaint is present and
# the DDXPlus groups give no confident answer. No probabilities are invented here.
#
# STATUS: DRAFT, NEEDS REVIEW with the D01 labels. Every rule names the public guideline it follows;
# `verified: false` until a team member has opened the reference and confirmed it supports the
# routing. Red-flag rules always run first and can only raise the window.
version: complaints-v1-draft
status: draft_needs_review

complaints:
  diabetes_control:
    concepts: [high_sugar, low_sugar_worry]
    specialties: [general_medicine, endocrinology]
    urgency: soon_72h
    reference: "NICE NG28, Type 2 diabetes in adults: management"
    verified: false
  blood_pressure_control:
    concepts: [high_bp_reading]
    specialties: [general_medicine, cardiology]
    urgency: soon_72h
    reference: "NICE NG136, Hypertension in adults: diagnosis and management"
    verified: false
  medicine_side_effect:
