  acute_dystonic_reactions: {specialties: [neurology, general_medicine], urgency: urgent_24h}
  unstable_angina: {specialties: [cardiology], urgency: emergency}
  stable_angina: {specialties: [cardiology, general_medicine], urgency: soon_72h}
