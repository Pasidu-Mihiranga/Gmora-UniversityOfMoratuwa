# Routing (NAV-4): condition group -> doctor types (ranked) and how soon.
#
# STATUS: DRAFT, NEEDS D01 REVIEW. Drafted by the engineering lead from each group's ICD-10
# chapter and DDXPlus severity so the engine runs; two team members label the groups blind (D01),
# a third resolves disagreements, and their labels replace these. This draft is never counted in
# the D01 agreement (kappa).
#
# Urgency is the window for seeing a doctor, not a diagnosis. Red-flag rules (safety) always set
# the floor first and can only raise it.
version: routing-v1-draft
status: draft_needs_d01_review

# For a child under 12 the children's doctor comes first, then the group's doctor types.
child_under: 12
child_specialty: paediatrics

groups:
  anaphylaxis: {specialties: [general_medicine], urgency: emergency}
  larygospasm: {specialties: [ent, general_medicine], urgency: emergency}
  ebola: {specialties: [general_medicine], urgency: emergency}
  possible_nstemi_stemi: {specialties: [cardiology], urgency: emergency}
  acute_pulmonary_edema: {specialties: [cardiology, respiratory], urgency: emergency}
  spontaneous_pneumothorax: {specialties: [respiratory, general_surgery], urgency: emergency}
  boerhaave: {specialties: [general_surgery, gastroenterology], urgency: emergency}
  epiglottitis: {specialties: [ent], urgency: emergency}
  guillain_barr_syndrome: {specialties: [neurology], urgency: emergency}
  croup: {specialties: [paediatrics, ent], urgency: urgent_24h}
  psvt: {specialties: [cardiology], urgency: urgent_24h}
