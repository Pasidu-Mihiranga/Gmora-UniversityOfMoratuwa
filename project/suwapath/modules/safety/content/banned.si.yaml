# Banned wording in patient-facing Sinhala (SAF-20, SAF-21). Each pattern is a regular expression
# on the text after normalization (NFC, no zero-width joiners, single spaces). Every pattern has an
# example it must catch and a safe near-miss it must not. Needs the native-speaker review (D05).
language: si
patterns:
  - id: SI-DX-001
    category: diagnosis
    regex: "(?:ඔබට|ඔයාට|ඔබ|ඔයා) .{0,40}(?:රෝගය|රෝගයක්|ලෙඩේ|ලෙඩක්|ආසාදනය|ආසාදනයක්|දියවැඩියාව|පිළිකාව|පිළිකාවක්|නියුමෝනියාව|ඩෙංගු|අංශභාගය|හෘදයාබාධය)(?:යි)? ?(?:ඇත|තියෙනවා|තිබේ|වැළඳී ඇත|හැදිලා|හැදී ඇත)"
    example: "ඔබට නියුමෝනියාව රෝගය ඇත."
    near_miss: "ඔබට වෛද්‍යවරයෙකු හමුවීමට වේලාවක් ඇත."
  - id: SI-DX-002
    category: diagnosis
    regex: "(?:මෙය|මේක|මේ තත්ත්වය) .{0,20}(?:රෝගය|රෝගයක්|ලෙඩේ|ලෙඩක්|දියවැඩියාව|ආසාදනය|ආසාදනයක්|පිළිකාව|හෘදයාබාධය|නියුමෝනියාව|ඩෙංගු)"
    example: "මේක දියවැඩියාවයි."
    near_miss: "මේක ඔබේ වෛද්‍ය හමුවීමේ වේලාවයි."
  - id: SI-DX-003
    category: diagnosis
    regex: "(?:එක්ස් රේ|එක්ස්රේ|x-ray|ස්කෑන්|වාර්තාව|වාර්තාවේ|රිපෝට්|පරීක්ෂණය|පරීක්ෂණයේ)(?: එකේ)? .{0,40}(?:පෙන්නනවා|පෙන්වයි|පෙන්වනවා|තහවුරු කරයි|තහවුරු වෙනවා|සොයාගෙන ඇත)"
    example: "ඔබේ එක්ස් රේ එකේ පෙනහළුවේ සෙවණැල්ලක් පෙන්වයි."
    near_miss: "ඔබේ වාර්තාව වෛද්‍යවරයාට බලන්න යැව්වා."
  - id: SI-RS-001
    category: reassurance
    regex: "(?:ඔබට|ඔයාට) (?:කිසි )?(?:ප්රශ්නයක් නැහැ|ප්රශ්නයක් නෑ|ප්රශ්නයක් නැත|කමක් නැහැ|කමක් නෑ|අවුලක් නැහැ|අවුලක් නෑ)|(?:ඔබ|ඔයා) (?:හොඳින්|සනීපෙන්|ගොඩක් හොඳින්) (?:ඉන්නවා|සිටී|සිටිනවා)"
    example: "ඔයාට කිසි ප්‍රශ්නයක් නැහැ."
    near_miss: "ඔයාට ප්‍රශ්නයක් තියෙනවා නම් අහන්න."
  - id: SI-RS-002
    category: reassurance
    regex: "(?:බය වෙන්න|බය වීමට|කනස්සලු වෙන්න|කනස්සල්ලට) (?:දෙයක් |කිසිවක් )?(?:එපා|ඕනේ නැහැ|ඕනේ නෑ|නැහැ|නෑ|නැත|අවශ්ය නැත)|බරපතල දෙයක් (?:නෙවෙයි|නොවේ|නැහැ|නෑ)"
    example: "බය වෙන්න දෙයක් නැහැ."
    near_miss: "බය හිතෙනවා නම් අපිට කියන්න."
  - id: SI-RS-003
    category: reassurance
    regex: "(?:දොස්තර|වෛද්ය|ඩොක්ටර්|රෝහල)(?:වරයෙක්|වරයා|වරයෙකු|ට|ටවත්)? (?:හම්බවෙන්න|හමුවෙන්න|හමුවීමට|ළඟට යන්න|යන්න) (?:ඕනේ නැහැ|ඕනේ නෑ|අවශ්ය නැත|අවශ්ය නැහැ)"
    example: "දොස්තර හම්බවෙන්න ඕනේ නැහැ."
    near_miss: "අද දොස්තර හම්බවෙන්න ඕනේ."
  - id: SI-DS-001
    category: dosing
    regex: "(?:පෙති|පෙත්ත|පෙත්තක්|කැප්සියුල|බෙහෙත්|ඉන්සියුලින්) (?:\\d+|එකක්|දෙකක්|තුනක්|හතරක්|භාගයක්|ඒකක \\d+) (?:බොන්න|ගන්න|ගන්නා|දෙන්න)"
    example: "පෙති දෙකක් බොන්න."
    near_miss: "පෙති ගැන දොස්තරගෙන් අහන්න."
  - id: SI-DS-002
    category: dosing
    regex: "(?:බෙහෙත්|බෙහෙත|ඖෂධ|පෙති|ඉන්සියුලින්)(?:ය|වල)? (?:බොන එක |ගන්න එක |මාත්රාව )?(?:නවත්තන්න|නවත්වන්න|නතර කරන්න|වැඩි කරන්න|අඩු කරන්න|දෙගුණ කරන්න|මඟ හරින්න)(?! එපා)"
    example: "බෙහෙත් බොන එක නවත්තන්න."
    near_miss: "දොස්තර හම්බවෙන්න කලින් බෙහෙත් නවත්තන්න එපා."
  - id: SI-PR-001
    category: probability
    regex: "\\d{1,3}(?:\\.\\d+)? ?% ?(?:ක )?(?:ඉඩක්|ඉඩකඩක්|ඉඩකඩ|සම්භාවිතාව|සම්භාවිතාවක්|අවදානමක්|විශ්වාසයක්)|සම්භාවිතාව"
    example: "නියුමෝනියාව වීමට 82% ඉඩක් ඇත."
    near_miss: "ඔයා මේ සතියේ බෙහෙත් වලින් 90% බිව්වා."
  - id: SI-BT-001
    category: banned_term
    regex: "රෝග විනිශ්චය|රෝග නිර්ණය|ට්රයාජ්|අපේ දොස්තර|අපේ වෛද්ය|වෛද්ය උපදෙස්"
    example: "මෙන්න ඔබේ රෝග විනිශ්චය."
    near_miss: "ඔබේ වෛද්‍යවරයා සඳුදා ඔබව බලයි."
