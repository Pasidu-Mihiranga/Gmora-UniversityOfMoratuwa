# Safety lexicon v1 (SAF-2): patient words -> concepts, in English (en), Sinhala (si) and Sinhala
# written in Latin script (si_latn). Matching is case-insensitive and by whole words; a trailing
# "*" matches any ending of the last word (for example "faint*" matches fainted and fainting).
# In Sinhala (si, si_latn) the last word of a phrase also matches with any ending when it has 4 or
# more letters (පපුවේ කැක්කුම matches කැක්කුමක්); shorter words (උණ, una) stay whole words.
# Every concept used by a red-flag rule must be here, in all three scripts (tests check this).
# The Sinhala entries need the native-speaker review (issue D05) before the demo.
version: lexicon-v1
concepts:
